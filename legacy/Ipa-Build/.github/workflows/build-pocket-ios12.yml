name: Pocket Code iOS 12
on:
  workflow_dispatch:
  push:
    paths:
      - "CodeSpacePocket-xtool-source.zip"
      - ".github/workflows/build-pocket-ios12.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Pocket Code
        run: unzip -q CodeSpacePocket-xtool-source.zip -d source
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS 12 native IPA
        working-directory: source/CodeSpacePocket
        run: bash scripts/build-unsigned.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PocketCode-iOS12-unsigned
          path: source/CodeSpacePocket/dist/CodeSpacePocket-unsigned.ipa
          if-no-files-found: error
